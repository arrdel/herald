[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herald"
version = "0.0.1"
description = "The dimensionality barrier and distillation cure in continuous speculative sampling"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "einops>=0.7",
    "timm>=0.9.12",
    "diffusers>=0.27",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "clean-fid>=0.1.35",
    "torchmetrics>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "ipykernel>=6.29",
]
log = [
    "wandb>=0.17",
]

# torch/torchvision are installed separately against the CUDA 12.1 wheel index;
# the driver on this machine (530.x) will not run cu124+ builds.
#   pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cu121

[tool.setuptools.packages.find]
include = ["herald*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
